name: Tests

# Logik-Tests der Web-App (Progression, Deload, Wochenziel …) – ohne Abhängigkeiten.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node web/test.mjs
