name: Deploy Web (GitHub Pages)

# Deployt die PWA aus web/ auf GitHub Pages.
# URL danach: https://albschu.github.io/iron-journal/

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages konfigurieren (und ggf. aktivieren)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: web/ als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
