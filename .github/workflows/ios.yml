name: iOS Build & Test

# Baut und testet die App auf einem echten macOS-Runner (kostenlos für
# öffentliche Repos). So lässt sich auf Linux ohne Mac prüfen, ob der
# SwiftUI-Code kompiliert und die Unit-Tests grün sind.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Build & Test (iOS Simulator)
        run: |
          xcodebuild \
            -project IronJournal.xcodeproj \
            -scheme IronJournal \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
